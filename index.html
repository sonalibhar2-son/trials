<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBF8F1">
<title>Trials</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--washi:#FBF8F1;--stone:#F1ECDD;--card:#fff;--ink:#2A2A28;--on-ink:#fff;--ink-soft:#6E6B63;--ink-faint:#9F9A8E;--line:#E1DCCF;--moss:#2C4A34;--on-moss:#fff;--brand:#2C4A34;--clay:#A8763A;--red:#A5483D;
--r-lg:20px;--r-md:14px;--r-pill:22px;--shadow-card:0 10px 22px -12px rgba(42,42,40,.2);--shadow-accent:0 10px 22px -10px rgba(44,74,52,.24);--scrim:rgba(42,42,40,.38)}
:root[data-theme=dark]{--washi:#1D1C19;--stone:#2A2925;--card:#33322D;--ink:#EDE8DB;--on-ink:#1D1C19;--ink-soft:#B6B1A3;--ink-faint:#8A8676;--line:#3D3B34;--moss:#8DB89A;--on-moss:#1D1C19;--brand:#8DB89A;--clay:#D2A064;--red:#D9776A;--shadow-card:0 10px 22px -12px rgba(0,0,0,.6);--shadow-accent:0 10px 22px -10px rgba(0,0,0,.6);--scrim:rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--washi)}
body{font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 20px calc(92px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
.serif{font-family:'Zen Old Mincho',serif}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.crumb{font-size:12px;color:var(--ink-faint);margin:14px 0 16px}
.back{font-size:13px;font-weight:600;color:var(--ink-soft);padding:6px 0}
.h1{font-family:'Zen Old Mincho',serif;font-weight:500;font-size:25px;margin:2px 0 8px;line-height:1.25}
.h2{font-family:'Zen Old Mincho',serif;font-weight:500;font-size:21px;margin:2px 0 8px}
.sub{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 18px}
.card{background:var(--stone);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.card.habit{border-left:6px solid var(--moss)}
.card.pin{outline:1.6px solid var(--ink-faint);outline-offset:-1.6px}
.item-name{font-family:'Zen Old Mincho',serif;font-weight:500;font-size:17px;line-height:1.3;padding-top:4px}
.icon-btn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.3px solid var(--line);color:var(--ink-faint);font-size:13px;flex-shrink:0}
.icon-btn.on{border-color:var(--moss);color:var(--moss);background:var(--washi)}
.lab-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--stone);flex-shrink:0;color:var(--ink)}
.btn{background:var(--moss);color:var(--on-moss);border-radius:var(--r-pill);padding:14px;font-weight:500;font-size:14.5px;width:100%;text-align:center;box-shadow:var(--shadow-accent)}
.btn.dark{background:var(--ink);color:var(--on-ink);box-shadow:none}
.btn.out{background:transparent;border:1.4px solid var(--moss);color:var(--moss);box-shadow:none}
.btn.red{background:var(--red);color:#fff;box-shadow:none}
.btn:disabled{opacity:.4}
.pill{background:var(--moss);color:var(--on-moss);font-size:12.5px;font-weight:500;padding:10px 14px;border-radius:var(--r-pill);flex-shrink:0}
.did{flex:1.4;background:var(--moss);color:var(--on-moss);text-align:center;font-weight:500;font-size:13.5px;padding:12px 6px;border-radius:var(--r-pill);box-shadow:var(--shadow-accent)}
.adj{flex:1;border:1.4px solid var(--ink-faint);color:var(--ink-soft);text-align:center;font-weight:500;font-size:13.5px;padding:12px 6px;border-radius:var(--r-pill)}
.actions{display:flex;gap:8px;margin-top:14px}
.field{width:100%;background:var(--stone);border:1.4px solid var(--line);border-radius:12px;padding:14px;font-size:15px;margin:6px 0 16px;outline:none}
.field:focus{border-color:var(--moss)}
.field.small{padding:12px;font-size:14px;margin:8px 0 0;background:transparent;border-style:dashed;border-color:var(--moss);border-radius:14px;resize:vertical}
.link{font-weight:500;font-size:13px;color:var(--moss)}
.faint{color:var(--ink-faint)}
.center{text-align:center}
.grow{flex:1}
.nav{display:flex;justify-content:center;gap:28px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.nav button{font-weight:500;font-size:13.5px;color:var(--ink-faint);padding:6px}
.meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;line-height:1.5}
.words{font-family:'Zen Old Mincho',serif;font-style:italic;color:var(--moss);font-size:14px;margin-top:3px;line-height:1.5}
.chk{width:34px;height:34px;border-radius:50%;background:var(--moss);color:var(--on-moss);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--on-moss);font-size:12px}
.box.on{background:var(--moss);border-color:var(--moss)}
.sec{font-size:12px;font-weight:700;color:var(--ink-faint);margin:20px 0 4px;letter-spacing:.04em}
.toggle{width:40px;height:23px;border-radius:12px;background:var(--line);position:relative;flex-shrink:0}
.toggle.on{background:var(--moss)}
.toggle i{width:17px;height:17px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:.15s}
.toggle.on i{left:20px}
.set{padding:16px 2px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%}
.set b{font-weight:500;font-size:15.5px;display:block}.set small{font-size:12.5px;color:var(--ink-faint);display:block;margin-top:3px;line-height:1.5}
.menu{position:absolute;right:20px;top:calc(62px + env(safe-area-inset-top));background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.22);border-radius:12px;padding:6px;width:240px;z-index:20}
.menu button{display:block;width:100%;text-align:left;padding:11px 10px;font-size:13.5px;font-weight:600;border-radius:8px}
.menu .mh{padding:8px 10px 6px;font-size:11.5px;color:var(--ink-faint)}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal{background:var(--washi);border-radius:24px;padding:26px;max-width:380px;width:100%}
.modal p{font-size:14.5px;line-height:1.65;color:var(--ink-soft);margin:6px 0 18px}
.modal .two,.two{display:flex;gap:10px}
.flash{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);opacity:.92;font-family:'Zen Old Mincho',serif;font-size:15px;padding:9px 18px;border-radius:18px;z-index:55;max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;animation:ff 1.5s ease forwards}@keyframes ff{0%{opacity:0}15%,65%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:20px;z-index:60;animation:tf 2.6s ease forwards;display:flex;align-items:center;gap:14px;max-width:92vw;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast button{font-weight:700;color:var(--on-ink);text-decoration:underline;padding:2px 4px}
@keyframes tf{0%{opacity:0;transform:translateX(-50%) translateY(6px)}8%,88%{opacity:1;transform:translateX(-50%)}100%{opacity:0}}
.pulse{display:inline-block;animation:cp .7s ease}
@keyframes cp{0%{transform:scale(1)}30%{transform:scale(1.25);color:var(--moss)}100%{transform:scale(1)}}
.side{position:fixed;inset:0;z-index:40;display:flex}
.side .pane{background:var(--stone);width:86%;max-width:360px;padding:calc(20px + env(safe-area-inset-top)) 16px 20px;overflow:auto;box-shadow:5px 0 18px rgba(0,0,0,.14)}
.side .shade{flex:1;background:var(--scrim)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:8px}
.sh b{font-family:'Zen Old Mincho',serif;font-weight:500;font-size:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.sitem{flex:1;text-align:left;background:var(--washi);border-radius:16px;padding:16px 16px;font-weight:500;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem.act{border-left:5px solid var(--moss)}
.srow .icon-btn{border:none;width:36px;height:36px;color:var(--ink-soft)}
.sadd{width:100%;border:1.6px dashed var(--ink-faint);border-radius:18px;padding:22px;text-align:center;color:var(--moss);font-size:15.5px;margin:6px 0 18px}
.conf{background:var(--washi);border-radius:16px;padding:16px;margin-bottom:10px}
.conf p{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:6px 0 14px}
.conf .btn{padding:11px;font-size:13.5px}
.inl{flex:1;min-width:0;background:var(--washi);border:1.4px dashed var(--moss);border-radius:12px;padding:13px 12px;font-family:'Zen Old Mincho',serif;font-size:15px;outline:none}
.sv2{font-size:13.5px;color:var(--moss);font-weight:700;padding:8px 8px;flex-shrink:0}
.sgrp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:18px 2px 8px}
.pinrow{display:block;width:100%;text-align:left;background:var(--washi);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-family:'Zen Old Mincho',serif;font-size:15px}
.prow{display:flex;align-items:center;gap:10px;padding:10px;border:1.4px solid var(--line);border-radius:var(--r-md);margin-bottom:8px}
.prow input{flex:1;border:none;background:none;font-family:'Zen Old Mincho',serif;font-size:16px;outline:none;min-width:0}
.swatch{width:28px;height:28px;border-radius:8px;flex-shrink:0}
.pal{display:flex;gap:10px;padding:2px 4px 14px;flex-wrap:wrap}.pal button{width:24px;height:24px;border-radius:50%}
.why h3{font-family:'Zen Old Mincho',serif;font-weight:500;font-size:19px;margin:30px 0 8px;line-height:1.3}
.why p{font-size:14.5px;line-height:1.75;color:var(--ink-soft);margin:0}
.seg{fill:none;stroke-width:24;stroke-linecap:round;cursor:pointer;transition:stroke-width .18s ease,filter .18s ease,opacity .15s}
@media (hover:hover){.seg:hover{stroke-width:31;filter:drop-shadow(0 5px 7px rgba(0,0,0,.28)) brightness(1.06)}}
.seg:active{stroke-width:21;opacity:.9;filter:none}
.lbl{transition:font-size .18s,font-weight .18s}.lbl.hot{font-weight:700;font-size:10.5px}.ring-t1{font-size:9.5px;fill:var(--ink-faint)}.ring-t2{font-family:'Zen Old Mincho',serif;font-size:21px;font-weight:600;fill:var(--brand)}
.lbl{font-size:9.5px;font-weight:500;fill:var(--ink);pointer-events:none}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 0}
.pinpill{font-size:12.5px;font-weight:600;color:var(--moss);background:var(--stone);border-radius:16px;padding:8px 13px}
/* lab */
.tipbox{display:flex;flex-direction:column;border:1.5px dashed var(--ink-faint);border-radius:20px;padding:16px 18px 12px;margin:4px 0 16px}
.tipbtn{display:flex;gap:14px;align-items:center;text-align:left;font-size:14.5px;line-height:1.6;color:var(--ink)}
.tipbtn b{color:var(--moss);font-weight:500}
.tipbox .hm{align-self:flex-end;font-size:13px;color:var(--ink-faint);font-weight:500;padding:6px 2px 0}
.tipshow{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-faint);padding:4px 0 14px;font-weight:500}
.sw{display:inline-flex;background:var(--washi);border-radius:20px;padding:4px;margin:12px 0 4px;gap:2px}
.sw button{padding:9px 14px;border-radius:16px;font-size:13.5px;font-weight:500;color:var(--ink-faint);white-space:nowrap}
.sw button.on{background:var(--moss);color:var(--on-moss)}
.tag{display:inline-block;background:var(--line);color:var(--ink-soft);font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:10px;margin-top:10px}
.cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:14.5px;color:var(--moss)}
.cfoot .link{font-size:14.5px;font-weight:600}
.pager{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-top:12px}
.pgl{display:flex;align-items:center;gap:6px}
.pgm{text-align:center;min-width:92px}
.ar2{width:44px;height:44px;border-radius:50%;background:var(--stone);font-size:24px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center}.ar2:disabled{opacity:.3}
.dots{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}.dots i{width:9px;height:9px;border-radius:5px;background:var(--line);display:block;transition:.2s}.dots i.on{width:28px}
.cap{font-size:13px;color:var(--ink-faint);margin-top:8px;white-space:nowrap}
.npill{border:1.6px solid var(--moss);color:var(--moss);border-radius:26px;padding:13px 18px;font-size:15px;font-weight:600;white-space:nowrap;margin-top:2px;display:flex;gap:8px;align-items:center}
/* completed */
.life{font-family:'Zen Old Mincho',serif;font-style:italic;font-size:21px;margin:0 0 6px}
.intro{background:var(--stone);border-radius:22px;padding:18px 20px;margin:16px 0 8px}
.intro b{font-weight:700;font-size:15.5px;display:block;margin-bottom:6px}
.intro p{margin:0;font-size:14.5px;line-height:1.65;color:var(--ink-soft)}
.intro em{font-style:normal;color:var(--moss);font-weight:600}
.crow{display:flex;gap:14px;align-items:flex-start;padding:16px 0 14px;border-bottom:1px solid var(--line)}
.ctitle{font-family:'Zen Old Mincho',serif;font-size:19px;font-weight:500;text-align:left;line-height:1.3;display:block}
.idp{display:inline-block;border:1.5px dashed var(--ink-faint);color:var(--moss);border-radius:18px;padding:11px 18px;font-size:14.5px;font-weight:600;margin-top:10px}
.idl{font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);margin-top:8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.4px solid var(--line);border-radius:20px;padding:10px 15px;font-size:14px;color:var(--ink-soft);text-align:left;line-height:1.35}
.chip.on{border-color:var(--moss);color:var(--moss)}
.dchip{display:inline-flex;align-items:center;gap:2px;background:var(--stone);border-radius:16px;padding:2px 4px 2px 12px;font-size:13px}
.dchip button{padding:7px 6px;color:var(--ink-soft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center;font-size:12px}
.cal b{font-weight:400;color:var(--ink-faint);font-size:10px}
.cd{padding:8px 0;border-radius:50%}.cd.s{background:var(--moss);color:var(--on-moss)}.cd:disabled{color:var(--line)}
.jarwrap{display:flex;justify-content:center;margin:10px 0 4px}
.jcard{background:var(--stone);border-radius:16px;padding:14px 16px;margin-top:12px}
.nm{font-family:'Zen Old Mincho',serif;font-weight:500;font-size:15.5px}
.list-row{padding:14px 2px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--clay)}
/* segmented appearance */
.segc{display:flex;background:var(--stone);border-radius:30px;padding:8px;margin:10px 0 20px;gap:4px}
.segc button{flex:1;padding:15px 6px;border-radius:24px;font-size:15px;font-weight:600;color:var(--ink-soft)}
.segc button.on{background:var(--brand);color:var(--on-moss);box-shadow:0 8px 16px -8px rgba(0,0,0,.4)}
/* zoom − + */
.zm{display:flex;background:var(--stone);border-radius:28px;height:56px;padding:0 4px;align-items:center}
.zm button{width:38px;height:48px;font-size:22px;font-weight:500;color:var(--ink);border-radius:24px}
.zm button:disabled{opacity:.3}
/* footer */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--washi);border-top:1px solid var(--line);padding:9px 0 calc(9px + env(safe-area-inset-bottom))}
#foot .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
#foot button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:500;color:var(--ink-faint);padding:4px 2px}
#foot button.on{color:var(--brand);font-weight:700}
#foot[hidden]{display:none}
</style>

<body>
<div id="app"></div>
<nav id="foot" hidden></nav>
<script>
const KEY='trials.v1';
const PAL=['#35573F','#3F657A','#AD8038','#96525F','#664F82','#357569','#855C38'];
const DEF=[['Physical Health',0],['Career',1],['Finance',2],['Relationships',3],['Hobbies',4],['Mental Health',5],['Spiritual Health',6]]
  .map((d,i)=>({id:'s'+(i+1),name:d[0],color:PAL[d[1]],isDefault:true}));
const fresh=()=>({onboarded:false,slices:JSON.parse(JSON.stringify(DEF)),projects:[],exps:[],entries:[],gratitude:[],showFinished:false,backup:null,lastProj:{},hideNames:false,flashName:true,theme:'light',tipHidden:false});
// ---------- data: saved to each person's own account (Firebase), with a copy on this device ----------
// IMPORTANT: keep the Firebase code (bottom of file). Data lives at users/{uid}/data/state.
let S=fresh(), USER=null, _cloudT=null, _saveWarned=false;
const lkey=()=>KEY+'.'+(USER?USER.uid:'');
const loadState=d=>{S=Object.assign(fresh(),d||{});if(S.backup&&S.backup.expiresAt<Date.now())S.backup=null};
const save=()=>{if(!USER)return;try{localStorage.setItem(lkey(),JSON.stringify(S))}catch(e){}
  clearTimeout(_cloudT);_cloudT=setTimeout(()=>{_cloudT=null;window.cloudSave&&window.cloudSave(S)},500)};
const flushSave=()=>{if(_cloudT){clearTimeout(_cloudT);_cloudT=null;window.cloudSave&&window.cloudSave(S)}};
window.TR={
  signedIn(user,cloud){USER=user;let d=cloud;
    if(!d){try{d=JSON.parse(localStorage.getItem(lkey()))}catch(e){}}
    let moved=false;
    if(!d){try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&!localStorage.getItem(KEY+'.movedTo')){d=old;moved=true;localStorage.setItem(KEY+'.movedTo',user.uid)}}catch(e){}}
    loadState(d);
    if(!cloud)window.cloudSave&&window.cloudSave(S);
    go(S.onboarded?'pie':'onboard');
    if(moved)toast('Your saved data is now in your account')},
  signedOut(){clearTimeout(_cloudT);_cloudT=null;USER=null;S=fresh();go('signin')},
  loadFailed(){go('offline')},
  saveFailed(){if(!_saveWarned){_saveWarned=true;toast('Couldn\'t save — check your connection');setTimeout(()=>_saveWarned=false,15000)}},
  signInFailed(m){toast(m||'Sign-in didn\'t work. Try again.')}
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave()});
window.addEventListener('pagehide',flushSave);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>isoOf(new Date());
const dayLabel=iso=>{const t=today();if(iso===t)return'Today';const y=new Date();y.setDate(y.getDate()-1);if(iso===isoOf(y))return'Yesterday';const [a,b,c]=iso.split('-').map(Number);return new Date(a,b-1,c).toLocaleDateString(undefined,{month:'short',day:'numeric',year:a===new Date().getFullYear()?undefined:'numeric'})};

// ---------- state helpers ----------
let v={n:'loading'}, ui={}, modal=null;
setTimeout(()=>{if(v.n==='loading')go('offline')},15000);
let slide=0,flash=false,newp=null,undoFn=null;
const go=(n,x={})=>{newp=null;v=Object.assign({n},x);ui={};render();window.scrollTo(0,0)};
const sl=id=>S.slices.find(s=>s.id===id);
const pr=id=>S.projects.find(p=>p.id===id);
const X=id=>S.exps.find(e=>e.id===id);
const activeProjects=sid=>S.projects.filter(p=>p.sliceId===sid&&p.status==='active');
const finishedProjects=sid=>S.projects.filter(p=>p.sliceId===sid&&p.status==='finished');
const dn=p=>S.hideNames?'Project '+(S.projects.filter(q=>q.sliceId===p.sliceId).indexOf(p)+1):p.name;
const delExp=id=>{S.exps=S.exps.filter(e=>e.id!==id);S.entries=S.entries.filter(e=>e.expId!==id)};
const delProject=id=>{S.exps.filter(e=>e.projectId===id).forEach(e=>delExp(e.id));S.projects=S.projects.filter(p=>p.id!==id)};
const projExps=pid=>S.exps.filter(e=>e.projectId===pid);
const liveExps=()=>S.exps.filter(e=>{const p=pr(e.projectId);return p&&p.status==='active'});
const countOf=id=>S.entries.filter(e=>e.expId===id).length;
const entriesOf=id=>S.entries.filter(e=>e.expId===id).sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
const isPinned=e=>e.focusDate===today();
const pinnedList=()=>liveExps().filter(e=>isPinned(e)&&e.status==='pending');
const doneToday=e=>S.entries.some(n=>n.expId===e.id&&n.date===today());
const projCrumb=()=>esc(sl(pr(v.p)?.sliceId)?.name||'')+' · Project Experiments';
const snapshot=()=>JSON.stringify(S);
const restoreFn=snap=>()=>{S=Object.assign(fresh(),JSON.parse(snap));save()};
const toast=(m,undo)=>{document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;if(undo){const b=document.createElement('button');b.textContent='Undo';b.dataset.a='undo';t.appendChild(b);undoFn=undo;t.style.animationDuration='5.6s'}document.body.appendChild(t);setTimeout(()=>t.remove(),undo?5600:2600)};
// run a change, save, and offer Undo. fn returns the toast message.
const mut=fn=>{const snap=snapshot();const msg=fn();save();toast(msg,restoreFn(snap))};
const ask=(title,body,label,fn,red=true)=>{modal={title,body,label,fn,red};render()};
function openSlice(sid){
  const act=activeProjects(sid);
  if(!act.length)return go('start',{s:sid});
  const p=act.find(x=>x.id===S.lastProj[sid])||act[0];
  go('lab',{p:p.id});
}
function setProj(pid){S.lastProj[pr(pid).sliceId]=pid;save()}
const IDENT=["I'm someone who creates luck","I'm someone who follows through","I'm someone who shows up, even on hard days","I'm someone who keeps promises to myself","I'm someone who puts myself out there","I'm someone who finishes what I start","I'm someone who learns by doing","I'm someone who takes small brave steps"];

// ---------- icons ----------
const ENSO=(s=26)=>`<svg width="${s}" height="${s}" viewBox="14 12 72 76" aria-hidden="true"><path d="M50 62 C50 50 50 38 50 30" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"/><path d="M50 36 C42 36 35 30 35 21 C44 21 50 27 50 36 Z" fill="var(--brand)"/><path d="M50 31 C57 31 64 26 64 18 C56 18 50 23 50 31 Z" fill="var(--brand)" opacity=".72"/><path d="M40 42 V74 A10 10 0 0 0 60 74 V42" fill="none" stroke="var(--brand)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 41 H66" stroke="var(--brand)" stroke-width="5" stroke-linecap="round"/><path d="M44.5 62 V74 A5.5 5.5 0 0 0 55.5 74 V62 Z" fill="var(--clay)"/></svg>`;
const BARS=`<svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>`;
const TRASH=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>`;
const PENCIL=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
const PIN=on=>`<svg width="15" height="15" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6ZM12 13v8"/></svg>`;
const JARICO=`<svg width="17" height="19" viewBox="0 0 16 18"><path d="M3 3 H13 M4 3 V14 Q4 16 6 16 H10 Q12 16 12 14 V3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7" cy="13" r="1.5" fill="var(--moss)"/><circle cx="10" cy="13" r="1.5" fill="var(--moss)"/></svg>`;
const T_PIE=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3v6.4M12 14.6V21M3.6 9l5.9 2M14.5 13l5.9 2M5.2 17.8l4.3-3.9M14.5 10.1l4.3-3.9"/></svg>`;
const T_SET=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>`;
const T_BOOK=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.6 3.5 5v13c3.5-.4 6.5 0 8.5 1.5M12 6.5C14 5 17 4.6 20.5 5v13c-3.5-.4-6.5 0-8.5 1.5M12 6.5v13"/></svg>`;
const back=(a,t)=>`<button class="back" data-a="${a}">← ${t}</button>`;

// ---------- views ----------
function vLoading(){return `<div class="empty">${ENSO(54)}<p class="sub" style="margin-top:18px">Loading…</p></div>`}
function vSignin(){return `<div class="empty">${ENSO(54)}<h1 class="h2" style="font-size:26px;margin-top:22px">Trials</h1>
<p class="sub" style="max-width:320px">Small experiments, one day at a time. Keep the goal out of sight and focus only on the next small thing you can try.</p>
<button class="btn" data-a="signin" style="max-width:300px">Sign in with Google</button></div>`}
function vOffline(){return `<div class="empty">${ENSO(54)}<h1 class="h2" style="font-size:22px;margin-top:22px">Just a moment…</h1>
<p class="sub" style="max-width:320px">Having trouble connecting. Make sure you're online, then tap below.</p>
<button class="btn" data-a="retry" style="max-width:300px">Try again</button></div>`}
function vOnboard(){return `<div class="empty">${ENSO(54)}<h1 class="h2" style="font-size:26px;margin-top:22px">This app is about the process.</h1>
<p class="sub" style="max-width:320px">The outcome you're after still gets written down — it just steps to the side, out of view. What stays in front of you is only ever the next small thing.</p>
<button class="btn" data-a="onboardGo" style="max-width:300px">Let's go</button>
<button class="link" data-a="why" style="margin-top:18px">Why does it work this way?</button></div>`}

function vPie(){
  const n=S.slices.length,C=2*Math.PI*88,slot=C/n,dash=slot*64/79;
  const hr=new Date().getHours(),g=hr<12?'Good Morning!':hr<18?'Good Afternoon!':'Good Evening!';
  let circles='',labels='';
  S.slices.forEach((s,i)=>{
    const rot=-90+i*360/n,rad=rot*Math.PI/180;
    circles+=`<circle class="seg" data-i="${i}" data-a="slice" data-id="${s.id}" cx="140" cy="140" r="88" stroke="${s.color}" stroke-dasharray="${dash.toFixed(2)} ${C.toFixed(2)}" transform="rotate(${rot.toFixed(2)} 140 140)"/>`;
    const x=140+114*Math.cos(rad),y=140+114*Math.sin(rad)+3;
    labels+=`<text class="lbl" data-i="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${esc(s.name.trim().split(/\s+/)[0].toLowerCase())}</text>`;
  });
  const np=pinnedList().length;
  return `<div class="row" style="margin-bottom:22px;min-height:36px"><span style="display:flex;align-items:center;gap:10px">${ENSO(30)}<b class="serif" style="color:var(--brand);font-size:22px;font-weight:500">Trials</b></span>${np?`<button class="pinpill" data-a="side">${np} pinned today</button>`:''}</div>
  <h1 class="h1" style="font-size:34px">${g}</h1><p class="sub">Inside each slice are your projects. Your projects are hidden in the sidebar menu so you can focus on your experiments.</p>
  <div style="display:flex;justify-content:center;margin:4px 0 14px"><svg viewBox="-26 0 332 280" style="width:100%;max-width:340px">${circles}
  <circle cx="140" cy="140" r="56" fill="var(--washi)" pointer-events="none" style="filter:drop-shadow(0 4px 10px rgba(0,0,0,.16))"/>
  <text pointer-events="none" x="140" y="133" text-anchor="middle" class="ring-t1">slices</text>
  <text pointer-events="none" x="140" y="156" text-anchor="middle" class="ring-t2">${n}</text>${labels}</svg></div>
  <div class="center"><button class="link faint" data-a="customize" style="font-size:13px">⚙ Customize Pie</button></div>`}

function vStart(){const s=sl(v.s);return `${back('pie','Pie')}<h1 class="h1" style="margin-top:10px;font-size:28px">${esc(s.name)} · Project Experiments</h1>
<div class="empty" style="flex:0;align-items:flex-start;text-align:left;padding:18px 0"><p class="sub" style="font-size:15px">Start a project to hold your experiments. Name the goal behind it, and it stays tucked away while you work.</p><button class="btn" data-a="newProj" data-id="${s.id}" style="width:auto;padding:14px 26px">Start a project</button></div>`}

function pager(p){
  const act=activeProjects(p.sliceId),i=act.findIndex(x=>x.id===p.id),multi=act.length>1,col=sl(p.sliceId).color;
  return `<div class="pager"><div class="pgl"><button class="ar2" data-a="cprev" style="visibility:${multi?'visible':'hidden'}" aria-label="Previous project">‹</button><div class="pgm"><div class="dots">${act.map((x,j)=>`<i class="${j===i?'on':''}" style="${j===i?`background:${col}`:''}"></i>`).join('')}</div><div class="cap">Project ${i+1} of ${act.length}</div></div><button class="ar2" data-a="cnext" style="visibility:${multi?'visible':'hidden'}" aria-label="Next project">›</button></div><button class="npill" data-a="addProject"><span style="font-size:20px;line-height:1">+</span> New project</button></div>`}

function card(e,col){
  const hab=e.repeats,n=countOf(e.id),pn=isPinned(e),t=doneToday(e);
  return `<div class="card ${hab?'habit':''} ${pn?'pin':''}" ${hab?`style="border-left-color:${col}"`:''}><div class="row" style="align-items:flex-start"><div class="item-name">${esc(e.name)}</div><span class="row" style="gap:8px;flex-shrink:0"><button class="icon-btn ${pn?'on':''}" style="width:42px;height:42px" data-a="pin" data-id="${e.id}" title="${pn?'Pinned for today':'Pin for today'}" aria-label="${pn?'Unpin':'Pin for today'}">${PIN(pn)}</button><button class="icon-btn" style="width:42px;height:42px" data-a="rmExp" data-id="${e.id}" aria-label="Remove">✕</button></span></div>
  <div class="sw"><button class="${hab?'':'on'}" data-a="setType" data-id="${e.id}" data-k="check">✓ Do once</button><button class="${hab?'on':''}" data-a="setType" data-id="${e.id}" data-k="log">↻ Log mode</button></div>
  ${pn?'<div><span class="tag">Pinned for today</span></div>':''}
  <div class="actions"><button class="did" data-a="did" data-id="${e.id}">${hab?'+ Log it':'✓ I did it'}</button><button class="adj" data-a="adjust" data-id="${e.id}">Edit</button></div>
  ${hab?`<div class="cfoot"><span>Shown up <span class="${ui.pulse===e.id?'pulse':''}">${n}</span> ${n===1?'time':'times'}${t?' · today ✓':''}</span><button class="link" data-a="markDone" data-id="${e.id}">Mark done</button></div>`:''}</div>`}

const ZS=[70,80,90,100,115,130];
const labZ=()=>ZS.includes(S.labZoom)?S.labZoom:90;
function vLab(){
  const p=pr(v.p),col=sl(p.sliceId).color;
  const exps=projExps(p.id).filter(e=>e.status==='pending').sort((a,b)=>(isPinned(b)?1:0)-(isPinned(a)?1:0));
  const sel=ui.sel;
  let body;
  if(!exps.length){
    body=`<div class="center" style="padding:34px 0 20px"><div class="h2" style="margin-bottom:6px">What will you try today?</div><p class="sub">Keep it tiny and doable.</p><button class="btn dark" style="width:auto;padding:13px 24px" data-a="addExp">Add first experiment</button></div><div class="grow"></div>`;
  }else if(sel){
    body=exps.map(e=>`<button class="list-row" data-a="selExp" data-id="${e.id}" style="width:100%;text-align:left"><span class="box ${sel.has(e.id)?'on':''}">${sel.has(e.id)?'✓':''}</span><span class="nm">${esc(e.name)}</span></button>`).join('')+
    `<div class="grow"></div><button class="btn red" ${sel.size?'':'disabled'} data-a="delSelExp">Delete ${sel.size} selected</button><button class="link faint center" style="padding:14px" data-a="cancelSel">Cancel</button>`;
  }else{
    body=exps.map(e=>card(e,col)).join('')+'<div class="grow"></div>';
  }
  const menu=ui.menu?`<div class="menu"><div class="mh">${esc(dn(p))}</div><hr><button data-a="selMode">Select experiments to delete</button><button data-a="delAll" style="color:var(--red)">Delete all experiments</button><hr><button data-a="finish">Mark project as finished</button></div>`:'';
  const tip=S.tipHidden?`<button class="tipshow" data-a="tipShow"><span style="color:var(--ink-faint)">${BARS}</span>Show tip: where is my project?</button>`:
  `<div class="tipbox"><button class="tipbtn" data-a="side"><span class="lab-icon">${BARS}</span><span>Open the <b>menu</b> to reveal the project these experiments are for. Projects are hidden so you can focus on the process.</span></button><button class="hm" data-a="tipHide">Hide this message</button></div>`;
  return `<div class="row" style="zoom:${Math.min(labZ(),90)/100}"><button class="lab-icon" style="width:56px;height:56px" data-a="side" aria-label="Projects menu">${BARS}</button>
  <span class="row" style="gap:10px"><button class="pill" style="padding:15px 22px;font-size:16px" data-a="addExp">+ Experiment</button><button class="lab-icon" style="width:56px;height:56px;font-weight:700;font-size:18px" data-a="menu" aria-label="More">⋯</button><span class="zm" role="group" aria-label="Zoom"><button data-a="zoomOut" aria-label="Zoom out" ${labZ()<=ZS[0]?'disabled':''}>−</button><button data-a="zoomIn" aria-label="Zoom in" ${labZ()>=ZS[ZS.length-1]?'disabled':''}>+</button></span></span></div>${menu}
  <div style="display:flex;flex-direction:column;flex:1;zoom:${labZ()/100}"><div style="margin-top:14px">${back('pie','Pie')}</div><h1 class="h1" style="font-size:30px;margin:8px 0 14px">${projCrumb()}</h1>${sel?'':tip}${body}
  ${sel?'':`<div class="nav" style="margin-top:12px"><button data-a="completed">Completed</button><button data-a="grat">Gratitude</button></div><div style="zoom:${Math.min(labZ(),90)/labZ()}">${pager(p)}</div>`}</div>`}

function vAdd(){return `${back('lab','Lab')}<div class="crumb">${projCrumb()}</div><h1 class="h2">What will you try today?</h1><p class="sub">Keep it tiny and doable.</p>
<input id="ename" class="field" placeholder="e.g. Read one page" autocomplete="off" maxlength="120"><button class="btn" data-a="saveExp">Add experiment</button>`}

function vAdjust(){const e=X(v.e);
return `${back('lab','Cancel')}<div class="crumb">${projCrumb()}</div><h1 class="h2">Edit experiment</h1><p class="sub">Make it smaller, change it — whatever fits.</p>
<input id="ename" class="field" value="${esc(e.name)}" maxlength="120"><button class="btn" data-a="saveAdjust">Save</button>
${e.repeats?`<div class="card" style="margin-top:24px"><b style="font-weight:600">Finished with this one?</b><p class="sub" style="margin:6px 0 14px;font-size:13.5px">Mark done clears the card from the lab. Everything you've logged stays in Completed, and you can bring it back any time.</p><button class="btn out" data-a="markDone" data-id="${e.id}" data-back="1">Mark done</button></div>`:''}`}

function idEditor(e){
  const val=ui.idv??'';
  return `<textarea id="idt-${e.id}" class="field small" rows="2" placeholder="I’m someone who…" maxlength="200">${esc(val)}</textarea>
  <div class="meta" style="margin:14px 0 2px;font-size:13px">Or pick one</div><div class="chips">${IDENT.map(t=>`<button class="chip ${val===t?'on':''}" data-a="idChip" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
  <div style="display:flex;gap:18px;margin-top:14px"><button class="link" style="font-size:19px" data-a="idSave" data-id="${e.id}">Save</button><button class="link faint" style="font-size:19px" data-a="idCancel">Cancel</button></div>`}
const identOf=e=>e.overall||(!e.repeats?((entriesOf(e.id).find(x=>x.words)||{}).words||''):'');

function vCompleted(){
  const p=pr(v.p),ex=projExps(p.id),ro=v.ro,col=sl(p.sliceId).color;
  const hab=ex.filter(e=>e.repeats&&countOf(e.id)).sort((a,b)=>lastTouch(b.id)-lastTouch(a.id));
  const one=ex.filter(e=>!e.repeats&&countOf(e.id)).sort((a,b)=>lastTouch(b.id)-lastTouch(a.id));
  const row=e=>{
    const ens=entriesOf(e.id),n=ens.length,open=ui.open===e.id,idt=identOf(e),editing=ui.idEdit===e.id;
    const meta=e.repeats?`${n} ${n===1?'time':'times'} · ${e.status==='doneForNow'?'Done':'Ongoing'}`:`Done ${dayLabel(ens[0].date)}`;
    return `<div class="crow"><span class="chk">✓</span><div class="grow" style="min-width:0"><button class="ctitle" data-a="copen" data-id="${e.id}">${esc(e.name)}</button><div class="meta" style="font-size:14px;margin-top:3px">${meta}</div>
    ${editing?'':(idt?`<div class="idl">IDENTITY</div><div class="words">${esc(idt)}</div>`:(ro?'':`<button class="idp" data-a="idEdit" data-id="${e.id}">+ Add your identity</button>`))}
    ${open?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">${ens.map(x=>`<span class="dchip"><button data-a="${ro?'':'editDate'}" data-id="${x.id}" style="${ro?'':'border-bottom:1px dashed var(--ink-faint);padding:7px 0'}">${dayLabel(x.date)}</button>${ro?'':`<button data-a="rmEntry" data-id="${x.id}" aria-label="Remove this log">×</button>`}</span>`).join('')}</div>${(()=>{const en=ens.find(x=>x.id===ui.ed);return en?`${calHTML(ui.dd||en.date,'calpick')}<button class="link" data-a="saveDate" data-id="${en.id}" style="margin-top:8px">Save</button>`:''})()}`:''}
    ${e.repeats&&e.status==='doneForNow'&&!ro?`<button class="link" data-a="bringBack" data-id="${e.id}" style="margin-top:10px;display:block">Bring back</button>`:''}</div>
    ${ro?'':`<button class="icon-btn" style="border:none;width:36px;height:36px;color:var(--ink-soft)" data-a="idEdit" data-id="${e.id}" aria-label="Edit identity">${PENCIL}</button><button class="icon-btn" style="border:none;width:36px;height:36px;color:var(--ink-soft)" data-a="rmItem" data-id="${e.id}" aria-label="Delete">${TRASH}</button>`}</div>${editing?`<div style="padding:0 0 16px;border-bottom:1px solid var(--line)">${idEditor(e)}</div>`:''}`};
  const none=!hab.length&&!one.length;
  return `<div class="row">${back(ro?'finished':'lab','Lab')}${ro?'':`<button class="lab-icon" style="width:48px;height:48px" data-a="jar" aria-label="Your jar">${JARICO}</button>`}</div>
  <h1 class="h1" style="font-size:34px;margin:8px 0 4px">Completed</h1><div class="life" style="color:${col}">Your life resume</div><div class="meta" style="font-size:14.5px;margin:0">${esc(sl(p.sliceId).name)} · ${esc(dn(p))}</div>
  <div class="intro"><b>Every win says something about you.</b><p>Add an identity line to each one, like “I’m someone who follows through.” Tap <em>+ Add your identity</em> or ✎ to write your own or pick a suggestion.</p></div>
  ${none?'<p class="sub center" style="padding:40px 0">Nothing here yet. When you tap “I did it”, it lands here.</p>':''}
  ${hab.length?`<div class="sec">Habits</div>${hab.map(row).join('')}`:''}
  ${one.length?`<div class="sec">Experiments</div>${one.map(row).join('')}`:''}
  ${none?'':'<p class="meta center" style="margin-top:22px;font-size:13.5px">Tap a habit to see its dates. Tap a date to change it.</p>'}`}
const lastTouch=id=>Math.max(0,...S.entries.filter(e=>e.expId===id).map(e=>e.ts||0));
const calHTML=(sel,act)=>{const t=today();const [a,b,c]=t.split('-').map(Number);const td=new Date(a,b-1,c);const dow=(td.getDay()+6)%7;const st=new Date(td);st.setDate(td.getDate()-dow-21);
  let cells='';for(let i=0;i<28;i++){const d=new Date(st);d.setDate(st.getDate()+i);const iso=isoOf(d);cells+=`<button class="cd ${iso===sel?'s':''}" ${iso>t?'disabled':''} data-a="${act}" data-d="${iso}">${d.getDate()}</button>`}
  return `<div class="cal"><b>M</b><b>T</b><b>W</b><b>T</b><b>F</b><b>S</b><b>S</b>${cells}</div>`};

function vGrat(){return `${back('lab','Lab')}<h1 class="h1" style="font-size:34px;margin:8px 0 16px">Gratitude</h1>
${ui.gadd?`<textarea id="gtext" class="field" rows="3" placeholder="I'm grateful for…" maxlength="300"></textarea><button class="btn" data-a="saveGrat">Save</button><div style="height:14px"></div>`:`<button class="btn dark" data-a="gadd" style="padding:20px;font-size:17px">🤍 What are you grateful for?</button><div style="height:14px"></div>`}

function vWhy(){return `<div class="why">${v.from==='onboard'?back('onboard','Back'):''}<h1 class="h1" style="font-size:34px;margin:8px 0 6px">How Trials works</h1>
<h3>Why we hide your goal.</h3><p>A big goal you can see every day creates a gap between where you are and where you want to be — and that gap is what makes people feel behind, not the goal itself. Once it's written down, we tuck it away. Nothing left to measure yourself against.</p>
<h3>Why this app is about actions, not outcomes.</h3><p>The goal isn't something you're secretly working toward in the background — it's meant to actually leave your mind. What's left is just the next experiment.</p>
<h3>Why we encourage small steps.</h3><p>Confidence isn't built by attempting hard things — it's built by a track record of actually doing them. The more doable a step is, the more likely you are to actually finish it — and that's what adds up.</p>
<h3>Why we ask who you're becoming.</h3><p>Every action is evidence of who you're becoming, not proof of how far you have left to go. In Completed, tap “+ Add your identity” under anything you've done and finish the sentence “I'm someone who…” in your own words, or pick a suggestion. Naming it yourself sticks more than anything the app could say for you.</p>
<h3>Why experiments work two ways.</h3><p>Every card has a small switch. Most things you add are Do once — do it once, tap “I did it,” and it goes straight into Completed. Some things you'll want to keep showing up for. Flip the card to Log mode and it stays put, with a “Log it” button that adds to a quiet count. “Mark done” sends it away — nothing is deleted, and you can bring it back any time.</p>
<h3>Why you can only pin three.</h3><p>Tap the pin on any card to keep it at the top for today. Three is enough to guide a day without turning it into a to-do list. Pins clear themselves tomorrow, so every day starts fresh.</p></div>`}

// ---------- theme ----------
const darkNow=()=>S.theme==='dark'||(S.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
const lum=a=>{const f=a.map(x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});return .2126*f[0]+.7152*f[1]+.0722*f[2]};
function accentFor(hex,dark){let c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)),n=0;
  if(dark){while((lum(c)+.05)/(lum([29,28,25])+.05)<4.8&&n++<40)c=c.map(x=>Math.min(255,Math.round(x+(255-x)*.1)))}
  else{while(1.05/(lum(c)+.05)<4.5&&n++<30)c=c.map(x=>Math.round(x*.94))}
  return c}
function applyTheme(){
  const dark=darkNow();document.documentElement.dataset.theme=dark?'dark':'light';
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=dark?'#1D1C19':'#FBF8F1';
  const root=document.getElementById('app');
  const themed=['jar','lab','addExp','adjust','completed','grat','rename','finlab'];
  let sid=null;
  if(newp)sid=newp.s;
  else if(themed.includes(v.n)&&v.p&&pr(v.p))sid=pr(v.p).sliceId;
  else if(v.n==='start'&&v.s)sid=v.s;
  const s=sid&&sl(sid);
  if(s){const c=accentFor(s.color,dark);root.style.setProperty('--moss','rgb('+c.join(',')+')');root.style.setProperty('--shadow-accent','0 10px 22px -10px rgba('+c.join(',')+',.28)')}
  else{root.style.removeProperty('--moss');root.style.removeProperty('--shadow-accent')}
  document.querySelectorAll('.flash,.toast').forEach(e=>{if(s)e.style.setProperty('--moss',root.style.getPropertyValue('--moss'))});
}
function footer(){
  const f=document.getElementById('foot');
  if(!USER||['onboard','loading','signin','offline'].includes(v.n)){f.hidden=true;return}
  const cur=['settings','finished','finlab'].includes(v.n)?'settings':v.n==='why'?'why':'pie';
  const b=(k,i,l,a)=>`<button class="${cur===k?'on':''}" data-a="${a}" ${cur===k?'aria-current="page"':''}>${i}<span>${l}</span></button>`;
  f.innerHTML=`<div class="in">${b('pie',T_PIE,'Pie','tabPie')}${b('settings',T_SET,'Settings','tabSettings')}${b('why',T_BOOK,'How Trials works','tabWhy')}</div>`;f.hidden=false;
}

function render(){
  const root=document.getElementById('app');
  const _sp=root.querySelector('.side .pane');const _st=_sp?_sp.scrollTop:0;
  const keepRen=ui.ren?document.getElementById('rn-'+ui.ren.id):null;if(keepRen)ui.ren.val=keepRen.value;
  root.innerHTML=VIEWS[v.n]()+(ui.side?sidebar():'')+(newp?`<div class="overlay"><div class="modal"><h2 class="h2" style="font-size:25px;line-height:1.25;margin-bottom:12px">What goal is this project for?</h2><p style="margin:2px 0 16px">Write the life goal you want to work toward, like “Make 10k a month” or “Run a half marathon.” It becomes this project's name and stays out of sight once you start, so you can focus on the process.</p><input id="pname" class="field" placeholder="e.g. Make 10k" autocomplete="off" maxlength="80" style="margin-bottom:18px"><div class="two"><button class="btn out" data-a="cancelNew" style="flex:1">Cancel</button><button class="btn" data-a="startProject" style="flex:1">Start</button></div></div></div>`:'')+(modal?`<div class="overlay"><div class="modal"><h2 class="h2" style="font-size:19px">${esc(modal.title)}</h2><p>${esc(modal.body)}</p><div class="two"><button class="btn out" data-a="mno" style="flex:1">Cancel</button><button class="btn ${modal.red?'red':''}" data-a="myes" style="flex:1">${esc(modal.label)}</button></div></div></div>`:'');
  if(slide){root.animate([{transform:`translateX(${slide*34}px)`,opacity:.35},{transform:'none',opacity:1}],{duration:220,easing:'ease-out'});slide=0}
  if(flash){flash=false;if(S.flashName&&v.n==='lab'&&pr(v.p)){const d=document.createElement('div');d.className='flash';d.textContent=dn(pr(v.p));document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}}
  const f=root.querySelector('#pname,#ename,#gtext,.inl,textarea');if(f&&!/iPhone|iPad|Android/.test(navigator.userAgent)){f.focus();if(f.setSelectionRange&&f.value)try{f.setSelectionRange(f.value.length,f.value.length)}catch(e){}}
  applyTheme();footer();
  if(_st){const sp2=root.querySelector('.side .pane');if(sp2)sp2.scrollTop=_st}
  const imp=root.querySelector('#imp');if(imp)imp.onchange=importFile;
}

  cprev(){slide=-1;flash=true;const act=activeProjects(pr(v.p).sliceId);if(act.length<2)return;const i=act.findIndex(x=>x.id===v.p);setProj(act[(i-1+act.length)%act.length].id);go('lab',{p:S.lastProj[pr(v.p).sliceId]})},
  cnext(){slide=1;flash=true;const act=activeProjects(pr(v.p).sliceId);if(act.length<2)return;const i=act.findIndex(x=>x.id===v.p);setProj(act[(i+1)%act.length].id);go('lab',{p:S.lastProj[pr(v.p).sliceId]})},
  tipHide(){S.tipHidden=true;save();render()},tipShow(){S.tipHidden=false;save();render()},
  addExp(){go('addExp',{p:v.p})},
  saveExp(){const n=val('ename');if(!n)return;S.exps.push({id:uid(),projectId:v.p,name:n,repeats:false,status:'pending'});save();go('lab',{p:v.p})},
  zoomOut(){const i=ZS.indexOf(labZ());if(i>0){S.labZoom=ZS[i-1];save();render();toast(S.labZoom+'%')}},
  zoomIn(){const i=ZS.indexOf(labZ());if(i<ZS.length-1){S.labZoom=ZS[i+1];save();render();toast(S.labZoom+'%')}},
  setType(d){const e=X(d.id),log=d.k==='log';if(!!e.repeats===log)return;e.repeats=log;save();toast(log?'Repeat experiment':'One-time experiment');render()},
  pin(d){const e=X(d.id);if(isPinned(e)){e.focusDate=null;save();toast('Unpinned');return render()}if(pinnedList().length>=3){toast('You can pin three a day. Unpin one first.');return}e.focusDate=today();save();toast('Pinned to the top for today');render()},
  did(d){const e=X(d.id);if(!e||(!e.repeats&&e.status==='done'))return;mut(()=>{S.entries.push({id:uid(),expId:e.id,date:today(),ts:Date.now(),words:''});if(!e.repeats){e.status='done';e.focusDate=null}const n=countOf(e.id);ui.pulse=e.repeats?e.id:null;return e.repeats?`Logged. Shown up ${n} ${n===1?'time':'times'}.`:'Done. It’s in Completed.'});render()},
  markDone(d){const e=X(d.id);mut(()=>{e.status='doneForNow';e.focusDate=null;return'Marked done. Still in Completed.'});if(d.back)go('lab',{p:v.p});else render()},
  rmExp(d){const e=X(d.id);mut(()=>{delExp(e.id);return`Removed “${e.name.length>28?e.name.slice(0,28)+'…':e.name}”`});render()},
  adjust(d){go('adjust',{p:v.p,e:d.id})},
  saveAdjust(){const e=X(v.e);const n=val('ename');if(n)e.name=n;save();go('lab',{p:v.p})},
  // completed
  copen(d){ui.open=ui.open===d.id?null:d.id;ui.ed=null;render()},
  idEdit(d){const e=X(d.id);ui.idEdit=d.id;ui.idv=identOf(e);render()},
  idChip(d){ui.idv=d.t;render()},
  idCancel(){ui.idEdit=null;ui.idv=null;render()},
  idSave(d){const e=X(d.id);const t=val('idt-'+e.id);mut(()=>{e.overall=t;if(!e.repeats)S.entries.filter(x=>x.expId===e.id).forEach(x=>x.words=t);return t?'Saved':'Identity cleared'});ui.idEdit=null;ui.idv=null;render()},
  editDate(d){const en=S.entries.find(x=>x.id===d.id);ui.ed=ui.ed===d.id?null:d.id;ui.dd=en.date;render()},
  calpick(d){ui.dd=d.d;render()},
  saveDate(d){const en=S.entries.find(x=>x.id===d.id);mut(()=>{if(ui.dd)en.date=ui.dd;return'Date changed'});ui.ed=null;render()},
  rmEntry(d){const en=S.entries.find(x=>x.id===d.id);const e=X(en.expId);mut(()=>{S.entries=S.entries.filter(x=>x.id!==d.id);if(e&&!e.repeats&&!countOf(e.id))S.exps=S.exps.filter(x=>x.id!==e.id);return'Removed that date'});render()},
  rmItem(d){const e=X(d.id);mut(()=>{delExp(e.id);return`Deleted “${e.name.length>28?e.name.slice(0,28)+'…':e.name}”`});render()},
  bringBack(d){const e=X(d.id);mut(()=>{e.status='pending';return'Back in the lab'});render()},
  editWords(d){ui.edit=d.id;render()},
  saveWords(d){const en=S.entries.find(x=>x.id===d.id);en.words=val('w-'+d.id);save();ui.edit=null;render()},
  completed(){go('completed',{p:v.p})},
  completedRO(){go('completed',{p:v.p,ro:true})},
  jar(){go('jar',{p:v.p})},
  marble(d){ui.sel=ui.sel===d.id?null:d.id;render()},
  grat(){go('grat',{p:v.p})},
  gadd(){ui.gadd=true;render()},
  saveGrat(){const t=val('gtext');if(!t)return;S.gratitude.push({id:uid(),text:t,date:today()});save();ui.gadd=false;render()},
  delGrat(d){mut(()=>{S.gratitude=S.gratitude.filter(g=>g.id!==d.id);return'Removed'});render()},
  // lab menu
  menu(){ui.menu=!ui.menu;render()},
  selMode(){ui.menu=false;ui.sel=new Set();render()},
  selExp(d){ui.sel.has(d.id)?ui.sel.delete(d.id):ui.sel.add(d.id);render()},
  cancelSel(){ui.sel=null;render()},
  delSelExp(){const ids=[...ui.sel];mut(()=>{ids.forEach(delExp);return`Removed ${ids.length} experiment${ids.length>1?'s':''}`});ui.sel=null;render()},
  delAll(){ui.menu=false;const p=pr(v.p);mut(()=>{projExps(p.id).forEach(e=>delExp(e.id));return'Removed all experiments'});render()},
  finish(){const p=pr(v.p);mut(()=>{p.status='finished';return'Moved to Finished Projects'});const act=activeProjects(p.sliceId);if(act.length){S.lastProj[p.sliceId]=act[0].id;save();go('lab',{p:act[0].id})}else go('pie')},
  // sidebar
  side(){ui.side=true;render()},sideclose(){ui.side=false;ui.ren=null;ui.del=null;render()},
  pgo(d){setProj(d.id);go('lab',{p:d.id})},
  renStart(d){ui.del=null;ui.ren={id:d.id,val:pr(d.id).name};render()},
  renSave(){const r=ui.ren;if(!r)return;const n=val('rn-'+r.id);if(n){pr(r.id).name=n;save()}ui.ren=null;render()},
  delAsk(d){ui.ren=null;ui.del=d.id;render()},delNo(){ui.del=null;render()},
  delYes(d){const x=pr(d.id),sid=x.sliceId;mut(()=>{delProject(x.id);return'Project deleted'});ui.del=null;const act=activeProjects(sid);if(v.p===x.id){if(act.length){S.lastProj[sid]=act[0].id;save();v={n:'lab',p:act[0].id}}else{ui.side=false;v={n:'start',s:sid}}}render()},
  reveal(){S.hideNames=!S.hideNames;ui.ren=null;save();render()},
  // finished
  finAll(){go('finished')},
  openFinished(d){go('finlab',{p:d.id})},
  reopen(){const p=pr(v.p);p.status='active';S.lastProj[p.sliceId]=p.id;save();toast('Project is back');go('lab',{p:p.id})},
  finished(){go('finished')},
  // settings
  theme(d){S.theme=d.k;save();render()},
  togFlash(){S.flashName=!S.flashName;save();render()},
  togFin(){S.showFinished=!S.showFinished;save();render()},
  customize(){const snap=JSON.stringify(S.slices);go('custom',{snap,from:v.n})},
  cancelCustom(){S.slices=JSON.parse(v.snap);save();go(v.from==='settings'?'settings':'pie')},
  saveCustom(){save();go(v.from==='settings'?'settings':'pie')},
  pal(d){ui.pal=ui.pal===d.id?null:d.id;render()},
  color(d){sl(d.id).color=d.c;save();ui.pal=null;render()},
  addSlice(){S.slices.push({id:uid(),name:'New slice',color:PAL[S.slices.length%7],isDefault:false});save();render();const i=document.querySelectorAll('.prow input');const l=i[i.length-1];l&&(l.focus(),l.select())},
  delSlice(d){const s=sl(d.id);if(S.slices.length<=1){toast('Keep at least one slice');return}
    const ps=S.projects.filter(p=>p.sliceId===s.id);const n=ps.length;
    ask('Delete “'+s.name+'”?',n?`This also deletes ${n===1?'its project':'its '+n+' projects'} and every experiment and log inside. This can't be undone. Want to keep a copy? Download a backup in Settings first.`:`“${s.name}” will be removed from your pie.`,'Delete',()=>{ps.forEach(p=>delProject(p.id));S.slices=S.slices.filter(x=>x.id!==s.id);save()})},
  reset(){ask('Reset to the default 7?','Any slices you\'ve added or renamed will be removed, along with everything inside them — projects, hidden goals, history. Your current setup will be kept for 30 days in case you change your mind, then deleted for good.','Reset',()=>{
    S.backup={slices:S.slices,projects:S.projects,exps:S.exps,entries:S.entries,lastProj:S.lastProj,expiresAt:Date.now()+30*864e5};
    S.slices=JSON.parse(JSON.stringify(DEF));const ids=new Set(S.slices.map(s=>s.id));
    const keepP=S.projects.filter(p=>ids.has(p.sliceId));const kp=new Set(keepP.map(p=>p.id));
    S.projects=keepP;const ke=S.exps.filter(e=>kp.has(e.projectId));const kx=new Set(ke.map(e=>e.id));S.exps=ke;S.entries=S.entries.filter(e=>kx.has(e.expId));
    save();toast('Pie reset')})},
  restore(){const b=S.backup;if(!b)return;S.slices=b.slices;S.projects=b.projects;S.exps=b.exps;S.entries=b.entries;S.lastProj=b.lastProj||{};S.backup=null;save();toast('Previous pie restored');render()},
  delBackup(){ask('Delete for good?','Your previous pie and everything in it will be gone permanently, with no 30-day window.','Delete now',()=>{S.backup=null;save()})},
  export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='trials-backup-'+today()+'.json';a.click()},
  // modal + undo
  mno(){modal=null;render()},
  myes(){const m=modal;modal=null;m.fn();ui.menu=false;render()},
  undo(){const f=undoFn;undoFn=null;document.querySelectorAll('.toast').forEach(t=>t.remove());if(!f)return;f();
    if(v.p&&!pr(v.p)){const first=S.projects.find(p=>p.status==='active');if(first)v={n:'lab',p:first.id};else v={n:'pie'}}
    else if(v.n==='start'&&activeProjects(v.s).length)v={n:'lab',p:activeProjects(v.s)[0].id};
    if(v.n==='adjust'&&!X(v.e))v={n:'lab',p:v.p};
    ui.open=ui.open;render()},
};
function importFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.slices||!d.projects)throw 0;ask('Replace everything in your account?','This swaps your current data for the backup file.','Restore',()=>{S=Object.assign(fresh(),d);save()},false)}catch(x){toast('That file isn\'t a Trials backup')}};r.readAsText(f)}

document.addEventListener('click',ev=>{
  if(newp&&ev.target.classList&&ev.target.classList.contains('overlay')){newp=null;render();return}
  const el=ev.target.closest('[data-a]');
  if(!el){if(ui.menu){ui.menu=false;render()}return}
  if(el.tagName==='INPUT'||el.tagName==='TEXTAREA')return;
  if(ui.menu&&el.dataset.a!=='menu'&&!el.closest('.menu')){ui.menu=false}
  const f=A[el.dataset.a];if(f)f(el.dataset);
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset&&t.dataset.a==='rename'){sl(t.dataset.id).name=t.value||'Slice';save()}
  else if(t.id&&t.id.startsWith('idt-'))ui.idv=t.value;
  else if(t.classList&&t.classList.contains('inl')&&ui.ren)ui.ren.val=t.value});
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if(ev.key==='Enter'&&t.classList&&t.classList.contains('inl')){ev.preventDefault();A.renSave();return}
  if(ev.key==='Enter'&&t.tagName==='INPUT'){const b=document.querySelector('.overlay .btn:not(.out)')||document.querySelector('.btn:not(.out):not(.dark)');if(b&&t.id)b.click();return}
  if((ev.key==='ArrowLeft'||ev.key==='ArrowRight')&&v.n==='lab'&&!ui.sel&&!ui.side&&!modal&&!newp&&!/INPUT|TEXTAREA/.test(t.tagName))A[ev.key==='ArrowLeft'?'cprev':'cnext']()});
let tx=null;document.addEventListener('touchstart',e=>{tx=e.target.closest('input,textarea')?null:e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null||v.n!=='lab'||ui.sel||ui.side||modal||newp)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>70)A[dx<0?'cnext':'cprev']()},{passive:true});
const hot=(e,on)=>{const c=e.target.closest&&e.target.closest('.seg');if(!c)return;const l=document.querySelector('.lbl[data-i="'+c.dataset.i+'"]');l&&l.classList.toggle('hot',on)};
document.addEventListener('mouseover',e=>hot(e,true));document.addEventListener('mouseout',e=>hot(e,false));
document.addEventListener('focusout',ev=>{if(ev.target.dataset&&ev.target.dataset.a==='rename'&&!ev.target.value.trim()){ev.target.value=sl(ev.target.dataset.id).name}});
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')render()})}catch(e){}
render();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwcSWAMcvh5r2lq-b3pjuWJTJT-Sv4naM",
  authDomain: "trials-a0628.firebaseapp.com",
  projectId: "trials-a0628",
  storageBucket: "trials-a0628.firebasestorage.app",
  messagingSenderId: "1035040348103",
  appId: "1:1035040348103:web:a9bb59dc5dfa9b50256be2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try { db = initializeFirestore(app, {localCache: persistentLocalCache()}); }   // works offline too
catch (e) { db = initializeFirestore(app, {}); }

// Each person's data lives at users/{their id}/data/state — the security rules only let them reach their own.
const ref = u => doc(db, 'users', u.uid, 'data', 'state');
let current = null;

window.cloudSave = S => {
  if (!current) return;
  setDoc(ref(current), {state: JSON.stringify(S), updatedAt: serverTimestamp()})
    .catch(e => { console.error(e); TR.saveFailed(); });
};
window.fbSignIn = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {
  if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
  console.error(e);
  TR.signInFailed(e.code === 'auth/popup-blocked' ? 'Your browser blocked the sign-in window. Allow pop-ups and try again.' : null);
});
window.fbSignOut = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  if (!u) { current = null; TR.signedOut(); return; }
  current = u;
  try {
    const snap = await getDoc(ref(u));
    let data = null;
    if (snap.exists()) data = JSON.parse(snap.data().state);
    TR.signedIn({uid: u.uid, email: u.email, name: u.displayName}, data);
  } catch (e) { console.error(e); TR.loadFailed(); }
});
</script>
